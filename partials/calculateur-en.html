<!-- Price calculator (EN) — generated by build.py from partials/calculateur-en.html + partials/tarifs.json -->
<div class="calc-box" data-lang="en"
     data-base="{{BASE}}"
     data-step="{{PAS}}"
     data-inc="{{INC}}"
     data-manche="{{MANCHE}}"
     data-libelle="{{LIBELLE}}"
     data-origine-defaut="{{ORIGINE_DEFAUT}}"
     data-grilles="{{GRILLES}}">
  <h3 class="calc-title">Calculate the price of your {{LIBELLE_TITRE}}</h3>

  {{ORIGINES}}

  {{EPAISSEUR}}

  <div class="calc-row">
    <label for="calc-l-{{ID}}">Width</label>
    <input type="range" id="calc-l-{{ID}}" min="5" max="120" value="30" data-role="w-range">
    <input type="number" min="5" max="120" value="30" data-role="w-num" aria-label="Width en millimètres"><span class="calc-unit">mm</span>
  </div>

  <div class="calc-row">
    <label for="calc-h-{{ID}}">Height</label>
    <input type="range" id="calc-h-{{ID}}" min="5" max="120" value="18" data-role="h-range">
    <input type="number" min="5" max="120" value="18" data-role="h-num" aria-label="Height en millimètres"><span class="calc-unit">mm</span>
  </div>

  {{OPTION_MANCHE}}

  <div class="calc-row">
    <label for="calc-q-{{ID}}">Quantity</label>
    <span></span>
    <input type="number" id="calc-q-{{ID}}" min="1" max="50" step="1" value="1" data-role="qte"><span class="calc-unit">pcs</span>
  </div>

  {{AVIS_RESUME}}

  <div class="calc-out">
    <div>
      <span class="calc-label">Your price</span>
      <span class="calc-detail" data-role="detail"></span>
    </div>
    <div class="calc-price" data-role="price">{{PRIX_DEFAUT}} €</div>
  </div>

  <p class="calc-mention" data-role="mention"></p>

  <div class="calc-actions">
    <a class="calc-btn-main" href="/pages/contact.html" data-role="cta">Request a quote</a>
    <a class="calc-btn-call" href="tel:+33780008855">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.2 2.4 3.2 4.4 5.6 5.6l1.9-1.9c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V19c0 .6-.4 1-1 1C10.4 20 4 13.6 4 5.4c0-.6.4-1 1-1h3.1c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1l-1.9 1.9z"/></svg>
      Call +33 7 80 00 88 55
    </a>
  </div>
  <p class="calc-hint">Several different models? Tell us in your message.</p>

  <details class="calc-table">
    <summary>See the full price grid</summary>
    <table>
{{GRILLE}}
    </table>
  </details>
</div>
